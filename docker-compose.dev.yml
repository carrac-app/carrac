# Local dev / quickstart compose.
#
# Trimmed variant of docker-compose.yml for a fast first boot on a fresh clone:
# one app container (no standby, no autoheal), no host resource limits, short
# healthcheck grace periods, and no host ports on postgres/redis. Started via
# `./scripts/quickstart.sh` or `make dev`.

name: ${COMPOSE_PROJECT_NAME:-carrac-dev}

services:
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - carrac-dev-redis:/data
    networks:
      - carrac-dev-network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    environment:
      - POSTGRES_DB=carrac
      - POSTGRES_USER=carrac
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - carrac-dev-postgres:/var/lib/postgresql/data
    networks:
      - carrac-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrac -d carrac"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  # Fixes ownership of the bind-mounted ./data dir for the non-root app user
  # (a fresh clone has no data/ on the host, so Docker creates it root:root,
  # which masks the image's build-time chown). Runs to completion and exits.
  # See the data-init service in docker-compose.yml for the details.
  data-init:
    build: .
    image: ${CARRAC_DEV_IMAGE:-carrac-dev}
    restart: "no"
    user: "0:0"
    volumes:
      - ./data:/app/data
    command: ["sh", "-c", "mkdir -p /app/data/dynamic && chown -R 1000:1000 /app/data"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  carrac:
    build: .
    image: ${CARRAC_DEV_IMAGE:-carrac-dev}
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${CARRAC_PORT:-5002}:5000"
    env_file:
      - .env
    environment: &carrac_env
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_SESSION_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - DATABASE_URL=postgresql://carrac:${POSTGRES_PASSWORD}@postgres:5432/carrac
      - DB_TYPE=postgresql
      - WORKER_MODE=true
    volumes:
      - ./data:/app/data
    networks:
      - carrac-dev-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:5000/health',timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 10
      # docker-compose.yml allows 600s here, which makes a first boot look hung
      # in `docker ps`. quickstart.sh polls /health itself, so this stays short.
      start_period: 120s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  # Builds the schema on first boot (fresh DB) so there is no manual step.
  # See the migrate service in docker-compose.yml for why no initdb hook is used.
  migrate:
    build: .
    image: ${CARRAC_DEV_IMAGE:-carrac-dev}
    restart: "no"
    command: ["python", "scripts/alembic_stamp_if_fresh.py"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment: *carrac_env
    networks:
      - carrac-dev-network
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  worker:
    build: .
    image: ${CARRAC_DEV_IMAGE:-carrac-dev}
    restart: unless-stopped
    stop_grace_period: 200s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment: *carrac_env
    volumes:
      - ./data:/app/data
    command: ["python", "worker.py"]
    networks:
      - carrac-dev-network
    healthcheck:
      test: ["CMD", "python", "-c", "import redis,os; r=redis.from_url(os.environ['REDIS_URL']); assert r.exists('mcd:worker:heartbeat')"]
      interval: 60s
      timeout: 15s
      retries: 3
      # The worker's HTF warmup really does take this long on a cold cache;
      # quickstart.sh polls readiness with its own timeout, not this.
      start_period: 900s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

volumes:
  carrac-dev-redis:
  carrac-dev-postgres:

networks:
  carrac-dev-network:
    driver: bridge
