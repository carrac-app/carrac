# requirements.lock: the exact package set the production image runs
# (python:3.11-slim), direct and transitive. The Dockerfile installs from this
# file and CI installs it too, so what is tested is what ships. requirements.txt
# declares the intent and floors; tests/test_requirements_lock.py checks that the
# two agree. Test tooling is not here: it lives in requirements-dev.txt.
#
# Regenerate after any requirements.txt change, on the same platform as the image:
#   docker run --rm -v "$PWD/requirements.txt:/r.txt:ro" python:3.11-slim \
#       sh -c 'pip install -q -r /r.txt >/dev/null 2>&1 && pip freeze'
# Bump single pins for security fixes rather than regenerating wholesale.
#
