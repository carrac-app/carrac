<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Carrac">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <title>Reset Password — Carrac</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}?v={{ cache_version('favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .skip-link{position:absolute;left:-9999px;top:0;padding:8px 12px;background:#000;color:#3fb950;z-index:9999}
        .skip-link:focus{left:8px;top:8px;outline:2px solid #3fb950;outline-offset:2px}
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: #000; color: #d1d4dc;
            min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
        }
        .container {
            background: #0a0a0f; border: 1px solid #1a1a2e;
            border-radius: 6px; padding: 40px;
            width: 100%; max-width: 400px;
        }
        .header { text-align: center; margin-bottom: 36px; }
        .header .logo { font-size: 1.1rem; font-weight: 700; color: #3fb950; letter-spacing: 0.02em; }
        .header p { color: #787b86; font-size: 0.75rem; margin-top: 10px; line-height: 1.5; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; margin-bottom: 6px;
            font-size: 0.75rem; font-weight: 500; color: #787b86;
            text-transform: uppercase; letter-spacing: 0.06em;
        }
        .form-group input {
            width: 100%; padding: 10px 14px;
            font-size: 0.85rem; font-family: 'JetBrains Mono', monospace;
            background: #000; border: 1px solid #1a1a2e;
            border-radius: 4px; color: #d1d4dc; transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none; border-color: #3fb950;
            box-shadow: 0 0 0 2px rgba(63, 185, 80, 0.1);
        }
        .form-group input::placeholder { color: #787b86; }
        .error-message {
            background: rgba(239, 83, 80, 0.08); border: 1px solid rgba(239, 83, 80, 0.25);
            color: #ef5350; padding: 10px 14px; border-radius: 4px;
            margin-bottom: 18px; font-size: 0.78rem; text-align: center;
        }
        .success-message {
            background: rgba(63, 185, 80, 0.08); border: 1px solid rgba(63, 185, 80, 0.25);
            color: #3fb950; padding: 10px 14px; border-radius: 4px;
            margin-bottom: 18px; font-size: 0.78rem; text-align: center;
        }
        .submit-btn {
            width: 100%; padding: 11px 20px;
            font-size: 0.85rem; font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            background: transparent; color: #3fb950;
            border: 1px solid #3fb950; border-radius: 4px;
            cursor: pointer; transition: all 0.2s; margin-top: 8px;
        }
        .submit-btn:hover { background: rgba(63, 185, 80, 0.08); }
        .submit-btn:active { background: rgba(63, 185, 80, 0.15); }
        .back-link {
            text-align: center; margin-top: 20px; padding-top: 20px;
            border-top: 1px solid #1a1a2e; font-size: 0.75rem; color: #787b86;
        }
        .back-link a { color: #8b5cf6; text-decoration: none; }
        .back-link a:hover { color: #a78bfa; }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main id="main-content">
    <div class="container">
        <div class="header">
            <div class="logo">[Carrac]</div>
            <p>Enter your email address and we'll send you a link to reset your password.</p>
        </div>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="success-message">{{ success }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus autocomplete="email" aria-describedby="email-error" aria-invalid="false">
                <span id="email-error" class="error-message" role="alert" style="display:none;margin-top:4px;padding:6px 10px;font-size:0.75rem;"></span>
            </div>
            <button type="submit" class="submit-btn">Send Reset Link</button>
        </form>

        <div class="back-link">
            <a href="{{ url_for('auth.login') }}">&larr; Back to sign in</a>
        </div>
    </div>
    </main>
</body>
</html>
