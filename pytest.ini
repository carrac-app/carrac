[pytest]
testpaths = tests
# Default test discovery — pure unit tests only.
# Integration smoke tests (they call a running API over HTTP) are deselected by
# default; opt in with `pytest -m integration` only when CONVEXITY_API_KEY
# points at a disposable instance.
addopts = -m "not integration"
markers =
    integration: tests that call a running API over HTTP; deselected by default
    slow: tests that take >5s; opt in with `pytest -m slow`

filterwarnings =
    ignore::DeprecationWarning:flask_session.*
    ignore::DeprecationWarning:werkzeug.*
    # starlette's TestClient prefers httpx2; httpx still works and fastapi imports it on its own.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    # slowapi (third party) calls asyncio.iscoroutinefunction; fixed upstream, nothing to do here.
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
    # hmmlearn (third party) sets ndarray.shape, deprecated in NumPy 2.5.
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
    # The session tests pass a per-request cookie on purpose: each request models a different browser cookie.
    ignore:Setting per-request cookies=:DeprecationWarning
    # The application still uses naive datetime.utcnow() in places; migrating it is an app change, not a test one.
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
    # Always surface leak-detector warnings so the baseline count is visible
    always::UserWarning:tests.conftest
