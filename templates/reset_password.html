<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Carrac">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <title>Set New Password — Carrac</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}?v={{ cache_version('favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: #000; color: #d1d4dc;
            min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
        }
        .container {
            background: #0a0a0f; border: 1px solid #1a1a2e;
            border-radius: 6px; padding: 40px;
            width: 100%; max-width: 400px;
        }
        .header { text-align: center; margin-bottom: 36px; }
        .header .logo { font-size: 1.1rem; font-weight: 700; color: #3fb950; letter-spacing: 0.02em; }
        .header p { color: #787b86; font-size: 0.75rem; margin-top: 10px; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; margin-bottom: 6px;
            font-size: 0.75rem; font-weight: 500; color: #787b86;
            text-transform: uppercase; letter-spacing: 0.06em;
        }
        .form-group input {
            width: 100%; padding: 10px 14px;
            font-size: 0.85rem; font-family: 'JetBrains Mono', monospace;
            background: #000; border: 1px solid #1a1a2e;
            border-radius: 4px; color: #d1d4dc; transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none; border-color: #3fb950;
            box-shadow: 0 0 0 2px rgba(63, 185, 80, 0.1);
        }
        .form-group input::placeholder { color: #787b86; }
        .form-group small { display: block; margin-top: 4px; font-size: 0.68rem; color: #787b86; }
        .error-message {
            background: rgba(239, 83, 80, 0.08); border: 1px solid rgba(239, 83, 80, 0.25);
            color: #ef5350; padding: 10px 14px; border-radius: 4px;
            margin-bottom: 18px; font-size: 0.78rem; text-align: center;
        }
        .submit-btn {
            width: 100%; padding: 11px 20px;
            font-size: 0.85rem; font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            background: transparent; color: #3fb950;
            border: 1px solid #3fb950; border-radius: 4px;
            cursor: pointer; transition: all 0.2s; margin-top: 8px;
        }
        .submit-btn:hover { background: rgba(63, 185, 80, 0.08); }
        .submit-btn:active { background: rgba(63, 185, 80, 0.15); }
        .back-link {
            text-align: center; margin-top: 20px; padding-top: 20px;
            border-top: 1px solid #1a1a2e; font-size: 0.75rem; color: #787b86;
        }
        .back-link a { color: #8b5cf6; text-decoration: none; }
        .back-link a:hover { color: #a78bfa; }
        /* Password strength meter */
        .strength-bar { height: 3px; background: #1a1a2e; border-radius: 2px; margin-top: 6px; overflow: hidden; }
        .strength-fill { height: 100%; width: 0; transition: width 0.3s, background 0.3s; border-radius: 2px; }
        .strength-text { font-size: 0.65rem; margin-top: 4px; color: #787b86; }
        .pw-hint { display: block; margin-top: 3px; font-size: 0.68rem; color: #787b86; transition: color 0.2s; }
        .pw-hint.fail { color: #ef5350; }
        .pw-hint.pass { color: #3fb950; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">[Carrac]</div>
            <p>Choose a new password</p>
        </div>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="password">New Password</label>
                <div style="position:relative;">
                    <input type="password" id="password" name="password" placeholder="new password" required minlength="12" autocomplete="new-password" aria-describedby="password-error pw-length pw-upper pw-lower pw-digit pw-special" aria-invalid="false" style="padding-right:40px;">
                    <button type="button" id="pw-toggle" aria-label="Show password" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#787b86;cursor:pointer;font-size:0.75rem;font-family:'JetBrains Mono',monospace;padding:0;">show</button>
                </div>
                <span id="password-error" class="error-message" role="alert" style="display:none;margin-top:4px;padding:6px 10px;font-size:0.75rem;"></span>
                <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
                <div class="strength-text" id="strength-text"></div>
                <span class="pw-hint" id="pw-length">At least 12 characters</span>
                <span class="pw-hint" id="pw-upper">One uppercase letter (A–Z)</span>
                <span class="pw-hint" id="pw-lower">One lowercase letter (a–z)</span>
                <span class="pw-hint" id="pw-digit">One number (0–9)</span>
                <span class="pw-hint" id="pw-special">One special character (!@#$%^&amp;*…)</span>
            </div>
            <div class="form-group">
                <label for="password_confirm">Confirm Password</label>
                <div style="position:relative;">
                    <input type="password" id="password_confirm" name="password_confirm" placeholder="confirm password" required autocomplete="new-password" aria-describedby="password-confirm-error pw-match" aria-invalid="false" style="padding-right:40px;">
                    <button type="button" id="pwc-toggle" aria-label="Show confirm password" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#787b86;cursor:pointer;font-size:0.75rem;font-family:'JetBrains Mono',monospace;padding:0;">show</button>
                </div>
                <span id="password-confirm-error" class="error-message" role="alert" style="display:none;margin-top:4px;padding:6px 10px;font-size:0.75rem;"></span>
                <span class="pw-hint" id="pw-match" style="display:none;">Passwords do not match</span>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">Set New Password</button>
        </form>

        <div class="back-link">
            <a href="{{ url_for('auth.login') }}">&larr; Back to sign in</a>
        </div>
    </div>
    <script nonce="{{ csp_nonce }}">
    (function() {
        var pw  = document.getElementById('password');
        var pwc = document.getElementById('password_confirm');
        var fill = document.getElementById('strength-fill');
        var txt  = document.getElementById('strength-text');
        var hintLen   = document.getElementById('pw-length');
        var hintUpper = document.getElementById('pw-upper');
        var hintLower = document.getElementById('pw-lower');
        var hintDigit = document.getElementById('pw-digit');
        var hintSpec  = document.getElementById('pw-special');
        var hintMatch = document.getElementById('pw-match');
        var submitBtn = document.getElementById('submit-btn');
        var form = pw.closest('form');
        var colors = {weak:'#ef5350',fair:'#ff9800',good:'#42a5f5',strong:'#3fb950'};
        var specialRe = /[!@#$%^&*()_+\-=\[\]{}|;':",./<>?]/;

        function setHint(el, v, pass) {
            el.className = 'pw-hint' + (v.length === 0 ? '' : (pass ? ' pass' : ' fail'));
        }

        function checkPw() {
            var v = pw.value;
            // Strength meter
            var score = 0;
            if (v.length >= 16) score += 30; else if (v.length >= 12) score += 20; else if (v.length > 0) score += 10;
            if (/[A-Z]/.test(v)) score += 15;
            if (/[a-z]/.test(v)) score += 15;
            if (/[0-9]/.test(v)) score += 15;
            if (specialRe.test(v)) score += 15;
            var uniq = new Set(v).size;
            if (v.length > 0 && uniq / v.length >= 0.6) score += 10;
            score = Math.min(100, score);
            var level = score >= 80 ? 'strong' : score >= 60 ? 'good' : score >= 40 ? 'fair' : 'weak';
            fill.style.width = (v.length ? score : 0) + '%';
            fill.style.background = colors[level];
            txt.textContent = v.length ? level : '';
            txt.style.color = colors[level];
            // Per-rule hints
            setHint(hintLen,   v, v.length >= 12);
            setHint(hintUpper, v, /[A-Z]/.test(v));
            setHint(hintLower, v, /[a-z]/.test(v));
            setHint(hintDigit, v, /[0-9]/.test(v));
            setHint(hintSpec,  v, specialRe.test(v));
            checkMatch();
        }

        function checkMatch() {
            var v1 = pw.value, v2 = pwc.value;
            if (v2.length === 0) {
                hintMatch.style.display = 'none';
                pwc.setAttribute('aria-invalid', 'false');
            } else if (v1 === v2) {
                hintMatch.style.display = 'block';
                hintMatch.textContent = 'Passwords match';
                hintMatch.className = 'pw-hint pass';
                pwc.setAttribute('aria-invalid', 'false');
            } else {
                hintMatch.style.display = 'block';
                hintMatch.textContent = 'Passwords do not match';
                hintMatch.className = 'pw-hint fail';
                pwc.setAttribute('aria-invalid', 'true');
            }
        }

        // Show/hide toggles
        function makeToggle(toggleBtn, input) {
            toggleBtn.addEventListener('click', function() {
                var showing = input.type === 'text';
                input.type = showing ? 'password' : 'text';
                toggleBtn.textContent = showing ? 'show' : 'hide';
                toggleBtn.setAttribute('aria-label', (showing ? 'Show' : 'Hide') + ' password');
            });
        }
        makeToggle(document.getElementById('pw-toggle'),  pw);
        makeToggle(document.getElementById('pwc-toggle'), pwc);

        pw.addEventListener('input', checkPw);
        pw.addEventListener('focus', checkPw);
        pwc.addEventListener('input', checkMatch);

        form.addEventListener('submit', function(e) {
            var v = pw.value;
            var ok = v.length >= 12 && /[A-Z]/.test(v) && /[a-z]/.test(v) && /[0-9]/.test(v) && specialRe.test(v);
            if (!ok) {
                e.preventDefault();
                checkPw();
                pw.setAttribute('aria-invalid', 'true');
                pw.focus();
                return;
            }
            if (v !== pwc.value) {
                e.preventDefault();
                hintMatch.style.display = 'block';
                hintMatch.textContent = 'Passwords do not match';
                hintMatch.className = 'pw-hint fail';
                pwc.setAttribute('aria-invalid', 'true');
                pwc.focus();
                return;
            }
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving…';
        });
    })();
    </script>
</body>
</html>
